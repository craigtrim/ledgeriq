[tool.poetry]
name = "ledgeriq"
version = "0.1.0"
description = "LedgerIQ automates receipt data extraction and expenditure analysis by ingesting multi-format receipt images, applying vision-based LLMs for structured data extraction into normalized line-item representations, and executing autonomous price benchmarking against real-time market data to identify purchasing inefficiencies and provide spend analytics with statistically-grounded price variance assessments."
license = "MIT"
readme = "README.md"

authors = ["Craig Trim <craigtrim@gmail.com>"]

maintainers = ["Craig Trim <craigtrim@gmail.com>"]

repository = "https://github.com/craigtrim/ledgeriq"

keywords = [
    "receipt",
    "ocr",
    "llm",
    "vision",
    "expenditure",
    "price-analysis",
    "benchmarking",
    "aws",
    "lambda",
    "fintech",
    "langchain",
    "agentic",
    "orchestration",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[tool.poetry.urls]
"Bug Tracker" = "https://github.com/craigtrim/ledgeriq/issues"


[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.35.0"
requests = "^2.32.3"
tabulate = "*"
pandas = "*"
langchain = "^0.1.0"
langchain-aws = "^0.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pre-commit = "^3.8.0"
autopep8 = "^2.3.1"
flakeheaven = "*"
plac = "^1.4.3"


[tool.pytest.ini_options]
markers = ["network: tests that make real HTTP requests"]

[tool.poetry.scripts]
# Add CLI scripts here as needed
# example = "ledgeriq.cli:main"


[tool.poetry.build]
generate-setup-file = true


[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


# ---------------------------------------------------------------------------
# flakeheaven
# ---------------------------------------------------------------------------
[tool.flakeheaven]
base = "https://raw.githubusercontent.com/flakeheaven/flakeheaven/main/pyproject.toml"
exclude = ["__init__.py", "README.md", "setup.py", ".venv", ".git"]
format = "grouped"
max_line_length = 500
show_source = true


[tool.flakeheaven.plugins]
"flake8-*" = ["+*"]
flake8-bandit = ["-*", "+S1??"]
flake8-docstrings = ["-*"]
pyflakes = ["+*", "-F401", "-F403"]
